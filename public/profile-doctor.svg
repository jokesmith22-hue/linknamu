  <path d="M58 90 C74 74 126 74 142 90 C140 84 138 80 136 78 C120 68 80 68 64 78 C62 80 60 84 58 90 Z" fill="#1D4ED8"/>
  <!-- 모자 무늬 -->
  <g fill="#93C5FD" opacity="0.55">
    <circle cx="82" cy="50" r="2.5"/><circle cx="100" cy="44" r="2.5"/><circle cx="118" cy="50" r="2.5"/>
    <circle cx="72" cy="64" r="2.5"/><circle cx="91" cy="58" r="2.5"/><circle cx="109" cy="58" r="2.5"/><circle cx="128" cy="64" r="2.5"/>
  </g>
  <!-- 모자 끈 -->
  <path d="M141 82 C150 84 156 92 154 102" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>
  <path d="M141 82 C152 80 160 86 162 94" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>

  <!-- 눈썹 -->
  <path d="M76 88 Q84 84 92 88" fill="none" stroke="#3F2A1D" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 88 Q116 84 124 88" fill="none" stroke="#3F2A1D" stroke-width="3" stroke-linecap="round"/>

  <!-- 눈 -->
  <circle cx="84" cy="101" r="3.5" fill="#1F2937"/>
  <circle cx="116" cy="101" r="3.5" fill="#1F2937"/>
  <circle cx="85.2" cy="99.8" r="1.1" fill="#FFFFFF"/>
  <circle cx="117.2" cy="99.8" r="1.1" fill="#FFFFFF"/>

  <!-- 안경 -->
  <g fill="#FFFFFF" fill-opacity="0.25" stroke="#1F2937" stroke-width="3">
    <rect x="70" y="91" width="28" height="21" rx="7"/>
    <rect x="102" y="91" width="28" height="21" rx="7"/>
