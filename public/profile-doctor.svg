  <!-- 명찰 -->
  <rect x="134" y="170" width="22" height="12" rx="2" fill="#2563EB"/>

  <!-- 귀 -->
  <ellipse cx="62" cy="102" rx="8" ry="11" fill="#EDB78F"/>
  <ellipse cx="138" cy="102" rx="8" ry="11" fill="#EDB78F"/>

  <!-- 얼굴 -->
  <ellipse cx="100" cy="98" rx="38" ry="42" fill="#F5C9A3"/>

  <!-- 옆머리 -->
  <path d="M63 86 C62 96 63 102 66 106 L69 88 Z" fill="#3F2A1D"/>
  <path d="M137 86 C138 96 137 102 134 106 L131 88 Z" fill="#3F2A1D"/>

