  <path d="M76 149 L100 186 L84 200 L64 200 L66 156 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round"/>
  <path d="M124 149 L100 186 L116 200 L136 200 L134 156 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-linejoin="round"/>
