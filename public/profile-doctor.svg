<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 22 176 176" width="200" height="200" role="img" aria-label="안경을 쓰고 푸른 수술모자를 쓴 정형외과 의사">
  <!-- 배경 -->
  <rect width="200" height="200" fill="#E0F2FE"/>
  <circle cx="100" cy="100" r="86" fill="#BAE6FD" opacity="0.6"/>

  <!-- 목 -->
  <rect x="87" y="122" width="26" height="32" rx="8" fill="#E2A97E"/>

  <!-- 몸: 흰 가운 + 푸른 수술복 -->
