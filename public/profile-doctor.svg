  <path d="M98 99 Q100 96 102 99" fill="none" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 97 L62 95" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
  <path d="M130 97 L138 95" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>

  <!-- 코 -->
  <path d="M100 106 Q97 114 101 116" fill="none" stroke="#D4936A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 볼 -->
  <ellipse cx="76" cy="118" rx="6" ry="3.5" fill="#F59E8B" opacity="0.45"/>
  <ellipse cx="124" cy="118" rx="6" ry="3.5" fill="#F59E8B" opacity="0.45"/>

  <!-- 미소 -->
  <path d="M88 124 Q100 134 112 124" fill="none" stroke="#9A3412" stroke-width="3" stroke-linecap="round"/>
</svg>
